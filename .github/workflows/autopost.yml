name: Free Trending Topic Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
          AUTO_COMMENT_ENABLED: "true"
          AUTO_COMMENT_TEXT: "Aapke hisaab se is update ka sabse bada impact kya hoga? Apni rai comment karein! 👇"
        run: python main.py

      - name: Save duplicate-prevention state
        if: ${{ vars.DRY_RUN != 'true' && vars.DRY_RUN != '' }}
        run: |
          if [ -f posted_items.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_items.json
            git diff --cached --quiet || git commit -m "Update posted item history"
            git push
          fi
